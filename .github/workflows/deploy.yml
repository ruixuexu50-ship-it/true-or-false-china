name: Deploy to GitHub Pages

on:
  # Trigger on every push to the default branch
  push:
    branches: ["main"]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Astro 7 requires Node >= 22.12.0; the runner default (20) fails the build.
          node-version: "22"
      - name: Install, build, and upload site
        uses: withastro/action@v3
        with:
          # Astro 7 requires Node >= 22.12.0; the action defaults to 20 and fails.
          node-version: "22"
        env:
          # Deploy the public (index,follow) build, not the local-review build.
          PUBLIC_RELEASE: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
